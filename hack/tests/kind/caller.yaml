# The client certificate the suite and the smoke test present. Every grant names
# its key, and rotation stays off so a deploy on a kept cluster still matches.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: conform-caller
  namespace: conform
spec:
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: fiberd-ca
  secretName: conform-caller-tls
  commonName: conform-caller
  usages:
    - client auth
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Never
