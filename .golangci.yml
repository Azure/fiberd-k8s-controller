version: "2"

run:
  timeout: 5m
  # test/envtest builds only under this tag.
  build-tags:
    - envtest

linters:
  default: standard
  enable:
    - errorlint
    - forbidigo
    - gocritic
    - misspell
    - nakedret
    - nilerr
    - prealloc
    - revive
    - unconvert
  settings:
    # Listing rules turns on only the listed ones. exported fails lint on an
    # exported identifier without a doc comment.
    revive:
      rules:
        - name: exported
    # Engineering rule: a unit test starts no process. The exclusion below
    # confines this to _test.go files. Importing os/exec stays allowed, since
    # fakes may name *exec.Cmd without starting one.
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^exec\.(Command|CommandContext)$
          pkg: ^os/exec$
          msg: "a unit test starts no process; fake the seam or move the test out of unit tests"
        - pattern: ^exec\.Cmd\.(Start|Run|Output|CombinedOutput)$
          pkg: ^os/exec$
          msg: "a unit test starts no process; fake the seam or move the test out of unit tests"
        - pattern: ^os\.(StartProcess|Executable)$
          pkg: ^os$
          msg: "a unit test starts no process and never re-executes itself"
  exclusions:
    generated: lax
    rules:
      # Production code may start processes. Only unit tests are guarded.
      - linters:
          - forbidigo
        path-except: _test\.go$

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/Azure/fiberd-k8s-controller
        - github.com/Azure/fiberd
  exclusions:
    generated: lax
