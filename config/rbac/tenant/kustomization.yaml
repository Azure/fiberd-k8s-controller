# The ClusterRoles a tenant namespace binds. role.yaml is generated by
# make manifests from the markers in pkg/workload/. The other two are
# written by hand, since no controller code uses them. config/tenant holds
# the RoleBindings.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - role.yaml
  - grant_role.yaml
  - grant_author_role.yaml
