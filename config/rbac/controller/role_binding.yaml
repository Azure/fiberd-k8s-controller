# Binds the generated ClusterRole, which reads grants and the objects the
# controller owns in every namespace. Writes to tenant namespaces come from
# the per-namespace RoleBinding in config/tenant.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fiberd-k8s-controller
  labels:
    app.kubernetes.io/name: fiberd-k8s-controller
    app.kubernetes.io/component: controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: fiberd-k8s-controller
subjects:
- kind: ServiceAccount
  name: fiberd-k8s-controller
  namespace: fiberd-system
