# Binds the generated Role in fiberd-system, which holds the leader-election
# Lease and its Events.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fiberd-k8s-controller-leader-election
  namespace: fiberd-system
  labels:
    app.kubernetes.io/name: fiberd-k8s-controller
    app.kubernetes.io/component: controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: fiberd-k8s-controller
subjects:
- kind: ServiceAccount
  name: fiberd-k8s-controller
  namespace: fiberd-system
