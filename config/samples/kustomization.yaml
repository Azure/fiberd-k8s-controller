apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# The GrantPolicy sample is not listed. kustomize orders a CapacityGrant
# before a GrantPolicy, so one apply would refuse the grant, and a second
# apply would overwrite the admin's edited default.
resources:
  - fiberd_v1alpha1_capacitygrant.yaml
  - resourcequota.yaml
