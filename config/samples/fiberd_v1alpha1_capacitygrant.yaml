apiVersion: fiberd.io/v1alpha1
kind: CapacityGrant
metadata:
  name: capacitygrant-sample
spec:
  zygote:
    digest: sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    command: ["/usr/local/bin/refzygote"]
  fibers:
    max: 32
    warm: 4
  writeBudget: 64Mi
  runtime: proc
  podTemplate:
    spec:
      containers:
      - name: fiberd
        # fiberd's image with the zygote program added. The controller sets
        # no default.
        image: registry.example/fiberd-refzygote:dev
        resources:
          limits:
            memory: 1Gi
