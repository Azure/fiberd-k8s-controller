apiVersion: fiberd.io/v1alpha1
kind: CapacityGrant
metadata:
  name: capacitygrant-sample
spec:
  zygote:
    digest: sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    command: ["/usr/local/bin/refzygote"]
  fibers:
    max: 32
    warm: 4
  writeBudget: 64Mi
  runtime: proc
  podTemplate:
    spec:
      containers:
      - name: fiberd
        # A placeholder for the tenant's image, fiberd's image with the
        # zygote program added. The controller sets no default. The
        # admission policy requires a digest and a repository the GrantPolicy
        # named default lists.
        image: ghcr.io/azure/fiberd:0.4.0@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
        resources:
          limits:
            memory: 1Gi
