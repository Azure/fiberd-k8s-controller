# Only the GrantPolicy named default is read. Each images entry is a
# repository and matches images under it with any tag. The gvisor
# repository is listed for the day gvisor joins runtimes. privilegedNamespaces
# is empty on purpose, so no grant may ask for the gvisor or hyperlight runtime
# until an admin names its namespace. registries is unset on purpose too, so
# no grant may pull its zygote until an admin lists the repository, as
# ghcr.io/team-a or, for plain HTTP, http://registry.local:5000/zygotes.
apiVersion: fiberd.io/v1alpha1
kind: GrantPolicy
metadata:
  name: default
spec:
  images:
    - ghcr.io/azure/fiberd
    - ghcr.io/azure/fiberd-runc
    - ghcr.io/azure/fiberd-gvisor
  runtimes: [proc, runc]
