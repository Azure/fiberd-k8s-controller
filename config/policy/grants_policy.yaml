# The admission guard of CapacityGrants. A grant Pod runs with the overlay
# the controller adds, so this policy refuses what a tenant could use to
# reach past that overlay. Its parameter is the GrantPolicy named default.
# The builder repeats the checks on the grant alone at reconcile time, since
# a grant stored before a rule existed must still not reach a Pod. The
# issuer reads the GrantPolicy to decide trust alone, and the rules on its
# lists still hold at admission only.
#
# Runs on Kubernetes 1.30 and later. The CEL used here is core CEL, the
# strings extension and macros, all present since 1.30.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: fiberd-grants
  labels:
    app.kubernetes.io/name: fiberd-k8s-controller
    app.kubernetes.io/component: admission
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: fiberd.io/v1alpha1
    kind: GrantPolicy
  matchConstraints:
    resourceRules:
      - apiGroups: ["fiberd.io"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["capacitygrants"]
  matchConditions:
    # Metadata-only writes, such as the controller removing its finalizer,
    # must pass under a GrantPolicy that has since been tightened.
    - name: spec-changed
      expression: "request.operation == 'CREATE' || object.spec != oldObject.spec"
  variables:
    # The CRD requires podTemplate.spec with exactly one container.
    - name: container
      expression: "object.spec.podTemplate.spec.containers[0]"
    - name: args
      expression: "has(variables.container.args) ? variables.container.args : []"
    - name: image
      expression: "has(variables.container.image) ? variables.container.image : ''"
    # The CRD allows helperImage only for runtime hyperlight, which needs it.
    - name: helperImage
      expression: "has(object.spec.helperImage) ? object.spec.helperImage : ''"
    # The CRD requires zygote, and a command zygote has no registry.
    - name: registry
      expression: "has(object.spec.zygote.registry) ? object.spec.zygote.registry : ''"
    # The fiberd flags a tenant may set, sorted. Every other flag is the
    # controller's or the operator's. A test keeps the list equal to
    # podtemplate's tenantFlags, which says why each is the tenant's.
    - name: tenantFlags
      expression: |-
        [
          'delta-key',
          'delta-registry',
          'delta-trust',
          'devices',
          'engine',
          'engine-memory-max',
          'grant-ceiling',
          'gvisor-templates-on-disk',
          'hyperlight-guest',
          'parity'
        ]
    - name: tenantFlagArgs
      expression: "variables.tenantFlags.map(f, '-' + f) + variables.tenantFlags.map(f, '--' + f)"
    # The boolean fiberd flags a tenant may write bare. Any other bare flag
    # would take the controller's first flag as its value. A test keeps it
    # equal to podtemplate's tenantBoolFlags.
    - name: bareArgs
      expression: "['-gvisor-templates-on-disk', '--gvisor-templates-on-disk']"
    # A guest value is empty or an absolute path, because fiberd refuses to
    # start on a relative path. A test keeps the pattern equal to
    # podtemplate.GuestArgPattern.
    - name: guestArgPattern
      expression: "'^-{1,2}hyperlight-guest=(/.*)?$'"
    - name: relativeGuests
      expression: "variables.args.filter(a, a.split('=')[0] in ['-hyperlight-guest', '--hyperlight-guest'] && !a.matches(variables.guestArgPattern))"
    # The only shape a tenant env name may take. A test keeps it equal to
    # podtemplate.EnvNamePattern, which says why names sit under one root.
    - name: envNamePattern
      expression: "'^FIBERD_TENANT_[A-Z0-9_]+$'"
    - name: envNames
      expression: "has(variables.container.env) ? variables.container.env.map(e, e.name) : []"
    - name: outsideEnv
      expression: "variables.envNames.filter(n, !n.matches(variables.envNamePattern))"
    - name: volumes
      expression: "has(object.spec.podTemplate.spec.volumes) ? object.spec.podTemplate.spec.volumes : []"
    # Every other source reaches the node or pulls with its credentials. A
    # test keeps the sources named here equal to podtemplate's allowedSource.
    - name: deniedVolumes
      expression: "variables.volumes.filter(v, !(has(v.emptyDir) || has(v.configMap) || has(v.secret) || has(v.downwardAPI) || has(v.projected) || has(v.persistentVolumeClaim) || has(v.ephemeral)))"
    # The kubelet bind-mounts a node file at terminationMessagePath, so it
    # is a mount like any other. Empty means unset, as it does to the builder.
    - name: mountPaths
      expression: |-
        (has(variables.container.volumeMounts) ? variables.container.volumeMounts.map(m, m.mountPath) : [])
        + (has(variables.container.volumeDevices) ? variables.container.volumeDevices.map(d, d.devicePath) : [])
        + ((has(variables.container.terminationMessagePath) && variables.container.terminationMessagePath != '') ? [variables.container.terminationMessagePath] : [])
    # The only directories a tenant may mount in. A test keeps the list equal
    # to podtemplate's mountRoots, which says why it is a list of allowed
    # directories.
    - name: mountRoots
      expression: "['/config', '/data', '/secrets']"
    # CEL cannot clean a path, so a path that is not already clean is refused.
    # The test is the builder's path.Clean(p) != p, spelled out.
    - name: uncleanPaths
      expression: "variables.mountPaths.filter(p, !p.startsWith('/') || p.contains('//') || p.contains('/./') || p.contains('/../') || p.endsWith('/.') || p.endsWith('/..') || (p != '/' && p.endsWith('/')))"
    - name: outsidePaths
      expression: "variables.mountPaths.filter(p, !variables.mountRoots.exists(r, p == r || p.startsWith(r + '/')))"
    # A mount naming an overlay volume would expose fiberd's keys, grants,
    # certificate or token at a path fibers can see.
    - name: ownedVolumes
      expression: "['fiberd-state', 'fiberd-grants', 'fiberd-tls', 'fiberd-grant-token', 'fiberd-helper', 'fiberd-seal-key']"
    - name: volumeNames
      expression: |-
        variables.volumes.map(v, v.name)
        + (has(variables.container.volumeMounts) ? variables.container.volumeMounts.map(m, m.name) : [])
        + (has(variables.container.volumeDevices) ? variables.container.volumeDevices.map(d, d.name) : [])
    - name: templateKeys
      expression: |-
        ((has(object.spec.podTemplate.metadata) && has(object.spec.podTemplate.metadata.labels)) ? object.spec.podTemplate.metadata.labels.map(k, k) : [])
        + ((has(object.spec.podTemplate.metadata) && has(object.spec.podTemplate.metadata.annotations)) ? object.spec.podTemplate.metadata.annotations.map(k, k) : [])
    # fiberd.io keys are the controller's. The AppArmor and seccomp
    # annotations would conflict with the fields the controller sets. The
    # rest are honoured by node components and reach host networks, host
    # devices or the sandbox, which the Pod-level rules otherwise prevent.
    - name: reservedKeyPrefixes
      expression: "['fiberd.io/', 'container.apparmor.security.beta.kubernetes.io/', 'seccomp.security.alpha.kubernetes.io/', 'container.seccomp.security.alpha.kubernetes.io/', 'k8s.v1.cni.cncf.io/', 'cni.projectcalico.org/', 'io.kubernetes.cri-o.', 'dev.gvisor.', 'io.katacontainers.']"
    # The CRD defaults runtimes, so the guard only keeps an object written
    # past the schema from erroring the policy. Absent means none.
    - name: runtimes
      expression: "has(params.spec.runtimes) ? params.spec.runtimes : []"
    # What a namespace with no exception label may use. Absent means none.
    - name: defaultRuntimes
      expression: "has(params.spec.defaultRuntimes) ? params.spec.defaultRuntimes : []"
    # The namespace label that adds one runtime as an exception. A test keeps
    # the prefix and value equal to v1alpha1's LabelRuntimePrefix and
    # LabelRuntimeValue.
    - name: runtimeLabelPrefix
      expression: "'runtimes.fiberd.io/'"
    - name: runtimeLabelValue
      expression: "'true'"
    - name: runtimeLabel
      expression: "variables.runtimeLabelPrefix + object.spec.runtime"
    # Any value other than runtimeLabelValue is no exception.
    - name: runtimeExcepted
      expression: "has(namespaceObject.metadata.labels) && variables.runtimeLabel in namespaceObject.metadata.labels && namespaceObject.metadata.labels[variables.runtimeLabel] == variables.runtimeLabelValue"
  validations:
    # A flag and its value are one item, so no tenant item can be read as the
    # value of another. The pattern is podtemplate.ArgPattern.
    - expression: "variables.args.all(a, a.matches('^-{1,2}[a-z][a-z0-9-]*(=.*)?$'))"
      messageExpression: "'arg ' + variables.args.filter(a, !a.matches('^-{1,2}[a-z][a-z0-9-]*(=.*)?$'))[0] + ' is not one flag such as -delta-registry=example.com'"
      message: "every podTemplate arg must be one flag such as -delta-registry=example.com"
      reason: Invalid
    - expression: "variables.args.all(a, a.split('=')[0] in variables.tenantFlagArgs)"
      messageExpression: "'arg ' + variables.args.filter(a, !(a.split('=')[0] in variables.tenantFlagArgs))[0] + ' names a flag a tenant may not set'"
      message: "a podTemplate arg names a flag a tenant may not set"
      reason: Forbidden
    - expression: "variables.args.all(a, a.contains('=') || a in variables.bareArgs)"
      messageExpression: "'arg ' + variables.args.filter(a, !a.contains('=') && !(a in variables.bareArgs))[0] + ' must carry its value as -name=value'"
      message: "a podTemplate arg must carry its value as -name=value, only a boolean flag may be bare"
      reason: Invalid
    - expression: "variables.relativeGuests.size() == 0"
      messageExpression: "'arg ' + variables.relativeGuests[0] + ' must carry an absolute path'"
      message: "a -hyperlight-guest arg must carry an absolute path"
      reason: Invalid
    # An absent image passes here. The controller reports InvalidSpec until
    # the grant sets one.
    - expression: "variables.image == '' || variables.image.matches('@sha256:[a-f0-9]{64}$')"
      message: "the fiberd container image must carry a digest, such as ghcr.io/azure/fiberd:0.4.0@sha256:..."
      reason: Invalid
    # The GrantPolicy schema forbids a bare host entry, so ':' after an entry
    # can only start a tag, never a port.
    - expression: "variables.image == '' || params.spec.images.exists(p, variables.image == p || variables.image.startsWith(p + '/') || variables.image.startsWith(p + ':') || variables.image.startsWith(p + '@'))"
      messageExpression: "'image ' + variables.image + ' is not under a repository listed in GrantPolicy default spec.images'"
      message: "the fiberd container image is not under a repository listed in GrantPolicy default spec.images"
      reason: Forbidden
    # A registry zygote is code this policy never sees, so its repository must
    # be listed. Neither form holds a tag or digest, so only / continues an
    # entry. Both are compared as written, scheme included, so plain HTTP
    # passes only under an entry that spells http://.
    - expression: "variables.registry == '' || (has(params.spec.registries) && params.spec.registries.exists(p, variables.registry == p || variables.registry.startsWith(p + '/')))"
      messageExpression: "'registry ' + variables.registry + ' is not under a repository listed in GrantPolicy default spec.registries'"
      message: "spec.zygote.registry is not under a repository listed in GrantPolicy default spec.registries"
      reason: Forbidden
    # The helper runs inside the fiberd container, so its image carries a
    # digest as fiberd's does. It is checked only against helperImages: the
    # helper runs under fiberd with far less than the fiberd container holds,
    # so a repository trusted for helpers does not qualify as a fiberd image.
    - expression: "variables.helperImage == '' || variables.helperImage.matches('@sha256:[a-f0-9]{64}$')"
      message: "spec.helperImage must carry a digest, such as ghcr.io/azure/fiberd-helper:0.4.0@sha256:..."
      reason: Invalid
    - expression: "variables.helperImage == '' || (has(params.spec.helperImages) && params.spec.helperImages.exists(p, variables.helperImage == p || variables.helperImage.startsWith(p + '/') || variables.helperImage.startsWith(p + ':') || variables.helperImage.startsWith(p + '@')))"
      messageExpression: "'helper image ' + variables.helperImage + ' is not under a repository listed in GrantPolicy default spec.helperImages'"
      message: "spec.helperImage is not under a repository listed in GrantPolicy default spec.helperImages"
      reason: Forbidden
    # The API server drops a messageExpression result that holds a line
    # break and uses message, so message states the pattern too.
    - expression: "variables.outsideEnv.size() == 0"
      messageExpression: "'env ' + variables.outsideEnv[0] + ' must match ' + variables.envNamePattern"
      message: "a podTemplate env name must match ^FIBERD_TENANT_[A-Z0-9_]+$"
      reason: Forbidden
    - expression: "!variables.templateKeys.exists(k, k.contains('.fiberd.io/') || variables.reservedKeyPrefixes.exists(p, k.startsWith(p)))"
      messageExpression: "'podTemplate key ' + variables.templateKeys.filter(k, k.contains('.fiberd.io/') || variables.reservedKeyPrefixes.exists(p, k.startsWith(p)))[0] + ' is reserved'"
      message: "a podTemplate label or annotation key is reserved"
      reason: Forbidden
    - expression: "variables.deniedVolumes.size() == 0"
      messageExpression: "'volume ' + variables.deniedVolumes[0].name + ' is not an emptyDir, configMap, secret, downwardAPI, projected, persistentVolumeClaim or ephemeral volume'"
      message: "a podTemplate volume uses a source the policy does not allow"
      reason: Forbidden
    # A token volume is minted for the grant ServiceAccount, and fibers could
    # read it at a tenant path.
    - expression: "!variables.volumes.exists(v, has(v.projected) && has(v.projected.sources) && v.projected.sources.exists(s, has(s.serviceAccountToken)))"
      messageExpression: "'volume ' + variables.volumes.filter(v, has(v.projected) && has(v.projected.sources) && v.projected.sources.exists(s, has(s.serviceAccountToken)))[0].name + ' projects a service account token'"
      message: "a podTemplate volume must not project a service account token"
      reason: Forbidden
    - expression: "!variables.volumeNames.exists(n, n in variables.ownedVolumes)"
      messageExpression: "'volume ' + variables.volumeNames.filter(n, n in variables.ownedVolumes)[0] + ' is mounted by the controller'"
      message: "a podTemplate volume or mount uses a volume name the controller owns"
      reason: Forbidden
    - expression: "variables.uncleanPaths.size() == 0"
      messageExpression: "'mount path ' + variables.uncleanPaths[0] + ' is not a clean absolute path'"
      message: "mountPath, devicePath and terminationMessagePath must be clean absolute paths"
      reason: Invalid
    - expression: "variables.outsidePaths.size() == 0"
      messageExpression: "'mount path ' + variables.outsidePaths[0] + ' must be at or under ' + variables.mountRoots.join(', ')"
      message: "a mountPath, devicePath or terminationMessagePath is outside the directories a tenant may mount in"
      reason: Forbidden
    - expression: "object.spec.runtime in variables.runtimes"
      messageExpression: "'runtime ' + object.spec.runtime + ' is not listed in GrantPolicy default spec.runtimes'"
      message: "spec.runtime must be listed in GrantPolicy default spec.runtimes"
      reason: Forbidden
    # The first refusal is the one reported, so this rule follows the ceiling
    # rule. A runtime outside the ceiling hears that, not advice about a label
    # that cannot help.
    - expression: "object.spec.runtime in variables.defaultRuntimes || variables.runtimeExcepted"
      messageExpression: "'runtime ' + object.spec.runtime + ' needs the label ' + variables.runtimeLabel + '=' + variables.runtimeLabelValue + ' on namespace ' + object.metadata.namespace"
      message: "a runtime outside GrantPolicy default spec.defaultRuntimes needs the label runtimes.fiberd.io/<runtime>=true on its namespace"
      reason: Forbidden
