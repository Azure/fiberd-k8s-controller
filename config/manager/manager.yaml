# Two replicas elect one leader to reconcile. Both sync their caches, so
# the standby is ready to take over at once.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fiberd-k8s-controller
  namespace: fiberd-system
  labels:
    app.kubernetes.io/name: fiberd-k8s-controller
    app.kubernetes.io/component: controller
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: fiberd-k8s-controller
      app.kubernetes.io/component: controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fiberd-k8s-controller
        app.kubernetes.io/component: controller
      annotations:
        kubectl.kubernetes.io/default-container: manager
    spec:
      serviceAccountName: fiberd-k8s-controller
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: fiberd-k8s-controller
                  app.kubernetes.io/component: controller
      terminationGracePeriodSeconds: 30
      containers:
      - name: manager
        image: controller:latest
        args:
        - --issuer-url=https://fiberd-k8s-controller.fiberd-system.svc:8443
        - --health-probe-bind-address=:8081
        - --tls-cert-file=/var/run/fiberd/tls/tls.crt
        - --tls-private-key-file=/var/run/fiberd/tls/tls.key
        - --client-ca-file=/var/run/fiberd/tls/ca.crt
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        ports:
        - name: https
          containerPort: 8443
          protocol: TCP
        - name: probes
          containerPort: 8081
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /healthz
            port: probes
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: probes
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tls
          mountPath: /var/run/fiberd/tls
          readOnly: true
      volumes:
      # The container runs as one user, so the key needs no fsGroup.
      # defaultMode stays at 0644 so user 65532 can read the root-owned files.
      - name: tls
        secret:
          secretName: fiberd-k8s-controller-tls
