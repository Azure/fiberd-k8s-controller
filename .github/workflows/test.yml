name: test

# Unit tests run as a normal user, like they do on a developer machine.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: unit tests (non-root)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Refuse to run as root
        run: |
          if [ "$(id -u)" -eq 0 ]; then
            echo "unit tests must run as a normal user" >&2
            exit 1
          fi
      - run: make test

  envtest:
    name: envtest (Kubernetes ${{ matrix.k8s }}, non-root)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        k8s: ["1.37.x", "1.30.x"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            hack/tools/go.sum
      - name: Refuse to run as root
        run: |
          if [ "$(id -u)" -eq 0 ]; then
            echo "envtest must run as a normal user" >&2
            exit 1
          fi
      - name: make test-envtest
        env:
          ENVTEST_K8S_VERSION: ${{ matrix.k8s }}
        run: make test-envtest

  images:
    name: controller image (amd64 and arm64, no push)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CONTROLLER_IMAGE: localhost/fiberd-k8s-controller:ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - run: make image-multiarch
      - run: make image
      - name: Check the image runs as non-root
        run: |
          user="$(docker image inspect --format '{{.Config.User}}' "$CONTROLLER_IMAGE")"
          if [ "$user" != "65532:65532" ]; then
            echo "the image runs as ${user:-root}, want 65532:65532" >&2
            exit 1
          fi
      - name: Check the binary starts
        run: docker run --rm "$CONTROLLER_IMAGE" --help
