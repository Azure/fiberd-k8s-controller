# Generated by make chart from config. Do not edit.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  labels:
    app.kubernetes.io/component: ca
    app.kubernetes.io/name: fiberd-k8s-controller
  name: fiberd-ca-certificates
spec:
  failurePolicy: Fail
  matchConditions:
  - expression: has(object.spec) && has(object.spec.issuerRef) && has(object.spec.issuerRef.name)
      && object.spec.issuerRef.name == 'fiberd-ca'
    name: fiberd-ca
  - expression: request.operation == 'CREATE' || object.spec != oldObject.spec
    name: spec-changed
  matchConstraints:
    resourceRules:
    - apiGroups:
      - cert-manager.io
      apiVersions:
      - '*'
      operations:
      - CREATE
      - UPDATE
      resources:
      - certificates
  validations:
  - expression: object.spec.all(k, k in variables.allowedFields)
    message: a Certificate for fiberd-ca may set only issuerRef, secretName, commonName,
      dnsNames, usages, duration, renewBefore, renewBeforePercentage, privateKey,
      secretTemplate and revisionHistoryLimit
    messageExpression: '''spec.'' + object.spec.filter(k, !(k in variables.allowedFields))[0]
      + '' is not allowed in a Certificate for fiberd-ca, which may set only '' +
      variables.allowedFields.join('', '')'
    reason: Forbidden
  - expression: (variables.client && variables.dnsNames.size() == 0) || variables.server
    message: a Certificate for fiberd-ca must have usages of exactly client auth with
      no dnsNames, or exactly server auth
    reason: Forbidden
  - expression: '!variables.server || request.namespace == ''fiberd-system'''
    message: a server auth Certificate for fiberd-ca is allowed only in fiberd-system,
      grant Pods get theirs from a csi volume
    reason: Forbidden
  - expression: '!variables.server || (variables.dnsNames.size() == 2 && ''fiberd-k8s-controller.fiberd-system.svc''
      in variables.dnsNames && ''fiberd-k8s-controller.fiberd-system.svc.cluster.local''
      in variables.dnsNames)'
    message: a server auth Certificate for fiberd-ca must have dnsNames of exactly
      fiberd-k8s-controller.fiberd-system.svc and fiberd-k8s-controller.fiberd-system.svc.cluster.local
    reason: Forbidden
  - expression: '!has(object.spec.commonName) || !object.spec.commonName.contains(''*'')'
    message: the commonName of a Certificate for fiberd-ca must not hold a wildcard
      *
    reason: Forbidden
  - expression: '!has(object.spec.duration) || variables.durationFormed'
    message: the duration of a Certificate for fiberd-ca must match ^([0-9]+[hms])+$,
      such as 24h
    reason: Forbidden
  - expression: '!variables.server || (variables.durationFormed && duration(object.spec.duration)
      <= duration(''24h''))'
    message: a server auth Certificate for fiberd-ca must set a duration of at most
      24h
    reason: Forbidden
  - expression: '!variables.client || !has(object.spec.duration) || (variables.durationFormed
      && duration(object.spec.duration) <= duration(''2160h''))'
    message: a client auth Certificate for fiberd-ca must leave duration unset or
      set it to at most 2160h
    reason: Forbidden
  variables:
  - expression: '[''issuerRef'', ''secretName'', ''commonName'', ''dnsNames'', ''usages'',
      ''duration'', ''renewBefore'', ''renewBeforePercentage'', ''privateKey'', ''secretTemplate'',
      ''revisionHistoryLimit'']'
    name: allowedFields
  - expression: 'has(object.spec.usages) ? object.spec.usages : []'
    name: usages
  - expression: 'has(object.spec.dnsNames) ? object.spec.dnsNames : []'
    name: dnsNames
  - expression: variables.usages == ['server auth']
    name: server
  - expression: variables.usages == ['client auth']
    name: client
  - expression: '''^([0-9]+[hms])+$'''
    name: durationForm
  - expression: has(object.spec.duration) && object.spec.duration.matches(variables.durationForm)
    name: durationFormed
