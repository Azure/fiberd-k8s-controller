# Generated by make chart from config. Do not edit.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  labels:
    app.kubernetes.io/component: admission
    app.kubernetes.io/name: fiberd-k8s-controller
  name: fiberd-grants
spec:
  failurePolicy: Fail
  matchConditions:
  - expression: request.operation == 'CREATE' || object.spec != oldObject.spec
    name: spec-changed
  matchConstraints:
    resourceRules:
    - apiGroups:
      - fiberd.io
      apiVersions:
      - '*'
      operations:
      - CREATE
      - UPDATE
      resources:
      - capacitygrants
  paramKind:
    apiVersion: fiberd.io/v1alpha1
    kind: GrantPolicy
  validations:
  - expression: variables.args.all(a, a.matches('^-{1,2}[a-z][a-z0-9-]*(=.*)?$'))
    message: every podTemplate arg must be one flag such as -delta-registry=example.com
    messageExpression: '''arg '' + variables.args.filter(a, !a.matches(''^-{1,2}[a-z][a-z0-9-]*(=.*)?$''))[0]
      + '' is not one flag such as -delta-registry=example.com'''
    reason: Invalid
  - expression: variables.args.all(a, a.split('=')[0] in variables.tenantFlagArgs)
    message: a podTemplate arg names a flag a tenant may not set
    messageExpression: '''arg '' + variables.args.filter(a, !(a.split(''='')[0] in
      variables.tenantFlagArgs))[0] + '' names a flag a tenant may not set'''
    reason: Forbidden
  - expression: variables.args.all(a, a.contains('=') || a in variables.bareArgs)
    message: a podTemplate arg must carry its value as -name=value, only a boolean
      flag may be bare
    messageExpression: '''arg '' + variables.args.filter(a, !a.contains(''='') &&
      !(a in variables.bareArgs))[0] + '' must carry its value as -name=value'''
    reason: Invalid
  - expression: variables.relativeGuests.size() == 0
    message: a -hyperlight-guest arg must carry an absolute path
    messageExpression: '''arg '' + variables.relativeGuests[0] + '' must carry an
      absolute path'''
    reason: Invalid
  - expression: variables.image == '' || variables.image.matches('@sha256:[a-f0-9]{64}$')
    message: the fiberd container image must carry a digest, such as ghcr.io/azure/fiberd:0.4.0@sha256:...
    reason: Invalid
  - expression: variables.image == '' || params.spec.images.exists(p, variables.image
      == p || variables.image.startsWith(p + '/') || variables.image.startsWith(p
      + ':') || variables.image.startsWith(p + '@'))
    message: the fiberd container image is not under a repository listed in GrantPolicy
      default spec.images
    messageExpression: '''image '' + variables.image + '' is not under a repository
      listed in GrantPolicy default spec.images'''
    reason: Forbidden
  - expression: variables.registry == '' || (has(params.spec.registries) && params.spec.registries.exists(p,
      variables.registry == p || variables.registry.startsWith(p + '/')))
    message: spec.zygote.registry is not under a repository listed in GrantPolicy
      default spec.registries
    messageExpression: '''registry '' + variables.registry + '' is not under a repository
      listed in GrantPolicy default spec.registries'''
    reason: Forbidden
  - expression: variables.helperImage == '' || variables.helperImage.matches('@sha256:[a-f0-9]{64}$')
    message: spec.helperImage must carry a digest, such as ghcr.io/azure/fiberd-helper:0.4.0@sha256:...
    reason: Invalid
  - expression: variables.helperImage == '' || (has(params.spec.helperImages) && params.spec.helperImages.exists(p,
      variables.helperImage == p || variables.helperImage.startsWith(p + '/') || variables.helperImage.startsWith(p
      + ':') || variables.helperImage.startsWith(p + '@')))
    message: spec.helperImage is not under a repository listed in GrantPolicy default
      spec.helperImages
    messageExpression: '''helper image '' + variables.helperImage + '' is not under
      a repository listed in GrantPolicy default spec.helperImages'''
    reason: Forbidden
  - expression: variables.outsideEnv.size() == 0
    message: a podTemplate env name must match ^FIBERD_TENANT_[A-Z0-9_]+$
    messageExpression: '''env '' + variables.outsideEnv[0] + '' must match '' + variables.envNamePattern'
    reason: Forbidden
  - expression: '!variables.templateKeys.exists(k, k.contains(''.fiberd.io/'') ||
      variables.reservedKeyPrefixes.exists(p, k.startsWith(p)))'
    message: a podTemplate label or annotation key is reserved
    messageExpression: '''podTemplate key '' + variables.templateKeys.filter(k, k.contains(''.fiberd.io/'')
      || variables.reservedKeyPrefixes.exists(p, k.startsWith(p)))[0] + '' is reserved'''
    reason: Forbidden
  - expression: variables.deniedVolumes.size() == 0
    message: a podTemplate volume uses a source the policy does not allow
    messageExpression: '''volume '' + variables.deniedVolumes[0].name + '' is not
      an emptyDir, configMap, secret, downwardAPI, projected, persistentVolumeClaim
      or ephemeral volume'''
    reason: Forbidden
  - expression: '!variables.volumes.exists(v, has(v.projected) && has(v.projected.sources)
      && v.projected.sources.exists(s, has(s.serviceAccountToken)))'
    message: a podTemplate volume must not project a service account token
    messageExpression: '''volume '' + variables.volumes.filter(v, has(v.projected)
      && has(v.projected.sources) && v.projected.sources.exists(s, has(s.serviceAccountToken)))[0].name
      + '' projects a service account token'''
    reason: Forbidden
  - expression: '!variables.volumeNames.exists(n, n in variables.ownedVolumes)'
    message: a podTemplate volume or mount uses a volume name the controller owns
    messageExpression: '''volume '' + variables.volumeNames.filter(n, n in variables.ownedVolumes)[0]
      + '' is mounted by the controller'''
    reason: Forbidden
  - expression: variables.uncleanPaths.size() == 0
    message: mountPath, devicePath and terminationMessagePath must be clean absolute
      paths
    messageExpression: '''mount path '' + variables.uncleanPaths[0] + '' is not a
      clean absolute path'''
    reason: Invalid
  - expression: variables.outsidePaths.size() == 0
    message: a mountPath, devicePath or terminationMessagePath is outside the directories
      a tenant may mount in
    messageExpression: '''mount path '' + variables.outsidePaths[0] + '' must be at
      or under '' + variables.mountRoots.join('', '')'
    reason: Forbidden
  - expression: '!(variables.privileged || (has(object.spec.runtime) && object.spec.runtime
      in variables.privilegedRuntimes)) || (has(params.spec.privilegedNamespaces)
      && object.metadata.namespace in params.spec.privilegedNamespaces)'
    message: a privileged fiberd container, which the gvisor and hyperlight runtimes
      need, is allowed only in a namespace listed in GrantPolicy default spec.privilegedNamespaces
    reason: Forbidden
  - expression: has(object.spec.runtime) && object.spec.runtime in variables.runtimes
    message: spec.runtime must be listed in GrantPolicy default spec.runtimes
    messageExpression: 'has(object.spec.runtime) ? ''runtime '' + object.spec.runtime
      + '' is not listed in GrantPolicy default spec.runtimes'' : ''spec.runtime is
      required'''
    reason: Forbidden
  variables:
  - expression: object.spec.podTemplate.spec.containers[0]
    name: container
  - expression: 'has(variables.container.args) ? variables.container.args : []'
    name: args
  - expression: 'has(variables.container.image) ? variables.container.image : '''''
    name: image
  - expression: 'has(object.spec.helperImage) ? object.spec.helperImage : '''''
    name: helperImage
  - expression: 'has(object.spec.zygote.registry) ? object.spec.zygote.registry :
      '''''
    name: registry
  - expression: |-
      [
        'delta-key',
        'delta-registry',
        'delta-trust',
        'devices',
        'engine',
        'engine-memory-max',
        'grant-ceiling',
        'gvisor-templates-on-disk',
        'hyperlight-guest',
        'parity'
      ]
    name: tenantFlags
  - expression: variables.tenantFlags.map(f, '-' + f) + variables.tenantFlags.map(f,
      '--' + f)
    name: tenantFlagArgs
  - expression: '[''-gvisor-templates-on-disk'', ''--gvisor-templates-on-disk'']'
    name: bareArgs
  - expression: '''^-{1,2}hyperlight-guest=(/.*)?$'''
    name: guestArgPattern
  - expression: variables.args.filter(a, a.split('=')[0] in ['-hyperlight-guest',
      '--hyperlight-guest'] && !a.matches(variables.guestArgPattern))
    name: relativeGuests
  - expression: '''^FIBERD_TENANT_[A-Z0-9_]+$'''
    name: envNamePattern
  - expression: 'has(variables.container.env) ? variables.container.env.map(e, e.name)
      : []'
    name: envNames
  - expression: variables.envNames.filter(n, !n.matches(variables.envNamePattern))
    name: outsideEnv
  - expression: 'has(object.spec.podTemplate.spec.volumes) ? object.spec.podTemplate.spec.volumes
      : []'
    name: volumes
  - expression: variables.volumes.filter(v, !(has(v.emptyDir) || has(v.configMap)
      || has(v.secret) || has(v.downwardAPI) || has(v.projected) || has(v.persistentVolumeClaim)
      || has(v.ephemeral)))
    name: deniedVolumes
  - expression: |-
      (has(variables.container.volumeMounts) ? variables.container.volumeMounts.map(m, m.mountPath) : [])
      + (has(variables.container.volumeDevices) ? variables.container.volumeDevices.map(d, d.devicePath) : [])
      + ((has(variables.container.terminationMessagePath) && variables.container.terminationMessagePath != '') ? [variables.container.terminationMessagePath] : [])
    name: mountPaths
  - expression: '[''/config'', ''/data'', ''/secrets'']'
    name: mountRoots
  - expression: variables.mountPaths.filter(p, !p.startsWith('/') || p.contains('//')
      || p.contains('/./') || p.contains('/../') || p.endsWith('/.') || p.endsWith('/..')
      || (p != '/' && p.endsWith('/')))
    name: uncleanPaths
  - expression: variables.mountPaths.filter(p, !variables.mountRoots.exists(r, p ==
      r || p.startsWith(r + '/')))
    name: outsidePaths
  - expression: '[''fiberd-state'', ''fiberd-grants'', ''fiberd-tls'', ''fiberd-grant-token'',
      ''fiberd-helper'', ''fiberd-seal-key'']'
    name: ownedVolumes
  - expression: |-
      variables.volumes.map(v, v.name)
      + (has(variables.container.volumeMounts) ? variables.container.volumeMounts.map(m, m.name) : [])
      + (has(variables.container.volumeDevices) ? variables.container.volumeDevices.map(d, d.name) : [])
    name: volumeNames
  - expression: |-
      ((has(object.spec.podTemplate.metadata) && has(object.spec.podTemplate.metadata.labels)) ? object.spec.podTemplate.metadata.labels.map(k, k) : [])
      + ((has(object.spec.podTemplate.metadata) && has(object.spec.podTemplate.metadata.annotations)) ? object.spec.podTemplate.metadata.annotations.map(k, k) : [])
    name: templateKeys
  - expression: '[''fiberd.io/'', ''container.apparmor.security.beta.kubernetes.io/'',
      ''seccomp.security.alpha.kubernetes.io/'', ''container.seccomp.security.alpha.kubernetes.io/'',
      ''k8s.v1.cni.cncf.io/'', ''cni.projectcalico.org/'', ''io.kubernetes.cri-o.'',
      ''dev.gvisor.'', ''io.katacontainers.'']'
    name: reservedKeyPrefixes
  - expression: has(variables.container.securityContext) && has(variables.container.securityContext.privileged)
      && variables.container.securityContext.privileged
    name: privileged
  - expression: '[''gvisor'', ''hyperlight'']'
    name: privilegedRuntimes
  - expression: 'has(params.spec.runtimes) ? params.spec.runtimes : []'
    name: runtimes
