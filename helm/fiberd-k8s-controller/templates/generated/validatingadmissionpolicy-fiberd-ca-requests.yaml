# Generated by make chart from config. Do not edit.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  labels:
    app.kubernetes.io/component: ca
    app.kubernetes.io/name: fiberd-k8s-controller
  name: fiberd-ca-requests
spec:
  failurePolicy: Fail
  matchConditions:
  - expression: has(object.spec) && has(object.spec.issuerRef) && has(object.spec.issuerRef.name)
      && object.spec.issuerRef.name == 'fiberd-ca'
    name: fiberd-ca
  matchConstraints:
    resourceRules:
    - apiGroups:
      - cert-manager.io
      apiVersions:
      - '*'
      operations:
      - CREATE
      resources:
      - certificaterequests
  validations:
  - expression: request.userInfo.username in ['system:serviceaccount:{{.Values.certManager.namespace}}:{{.Values.certManager.serviceAccount}}',
      'system:serviceaccount:{{.Values.certManager.namespace}}:{{.Values.certManager.csiDriverServiceAccount}}']
    message: only the issuing controller's and the csi-driver's ServiceAccounts may
      create a CertificateRequest for fiberd-ca
    reason: Forbidden
  - expression: '!has(object.spec.isCA) || !object.spec.isCA'
    message: a CertificateRequest for fiberd-ca must not set isCA, fiberd-ca issues
      leaf certificates only
    reason: Forbidden
  - expression: variables.server || variables.client
    message: a CertificateRequest for fiberd-ca must have usages of exactly server
      auth or exactly client auth
    reason: Forbidden
  - expression: '!variables.server || (has(object.spec.duration) && duration(object.spec.duration)
      <= duration(''24h''))'
    message: a server auth CertificateRequest for fiberd-ca must set a duration of
      at most 24h
    reason: Forbidden
  - expression: '!variables.client || !has(object.spec.duration) || duration(object.spec.duration)
      <= duration(''2160h'')'
    message: a client auth CertificateRequest for fiberd-ca must leave duration unset
      or set it to at most 2160h
    reason: Forbidden
  variables:
  - expression: 'has(object.spec.usages) ? object.spec.usages : []'
    name: usages
  - expression: variables.usages == ['server auth']
    name: server
  - expression: variables.usages == ['client auth']
    name: client
