{{- /*
The chart bundles neither cert-manager nor its csi-driver, so the install stops
here when either is missing.

cert-manager serves an API, which Capabilities sees. helm template has no
cluster, so it needs --api-versions cert-manager.io/v1.

The csi-driver has no CRD. Its CSIDriver object is what it leaves in the API,
and that name must match csiDriverName in pkg/workload/podtemplate. lookup
returns nothing without a cluster, so this check runs only when lookup can see
kube-system, and helm template skips it.
*/ -}}
{{- if not (.Capabilities.APIVersions.Has "cert-manager.io/v1") }}
  {{- fail "cert-manager.io/v1 is not served. Install cert-manager first, or pass --api-versions cert-manager.io/v1 to helm template." }}
{{- end }}
{{- if lookup "v1" "Namespace" "" "kube-system" }}
  {{- if not (lookup "storage.k8s.io/v1" "CSIDriver" "" "csi.cert-manager.io") }}
    {{- fail "the CSIDriver csi.cert-manager.io does not exist. Install the cert-manager csi-driver first." }}
  {{- end }}
{{- end }}
